<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>aaghash murugesan · still running</title>
<meta name="description" content="aaghash murugesan, python dev. every repo since 19 sep 2022, timed. the clock never stops.">
<meta name="theme-color" content="#faf7f2">
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='13' y='1' width='6' height='4' rx='1' fill='%23f5a623'/%3E%3Ccircle cx='16' cy='18' r='12' fill='%23141416' stroke='%23f5a623' stroke-width='3'/%3E%3Cpath d='M16 18V9' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
@font-face{font-family:"SG Fallback";src:local("Arial"),local("Helvetica Neue"),local("Helvetica");size-adjust:104%;ascent-override:90%;descent-override:27%;line-gap-override:0%}
@font-face{font-family:"JB Fallback";src:local("Menlo"),local("Consolas"),local("Courier New");size-adjust:100%;ascent-override:100%;descent-override:28%;line-gap-override:0%}
:root{
  --bg:#faf7f2;--fg:#1a1a1a;--muted:#6f6a62;--card:#ffffff;--line:#e8e2d8;
  --accent:#f5a623;--accent-ink:#a85f00;--accent-soft:rgba(245,166,35,.14);
  --fastest:#b36bff;--fastest-ink:#7a3ccc;--hit:#3ad06b;--slate:#64748b;--slate-ink:#475569;
  --chip:rgba(255,255,255,.8);--chip-line:rgba(26,26,26,.08);
  --shadow:0 1px 2px rgba(40,25,0,.05),0 14px 36px -14px rgba(60,40,10,.22);
  --sky:#d6e6fb;
  --sans:"Space Grotesk","SG Fallback",system-ui,sans-serif;
  --mono:"JetBrains Mono","JB Fallback",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- stage ---------- */
.stage{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden;background:var(--sky);isolation:isolate;outline:none}

.hud-top{position:absolute;inset:0 0 auto 0;z-index:4;display:grid;grid-template-columns:1fr auto;grid-template-areas:"who clock" "who ctl";column-gap:20px;row-gap:10px;align-items:start;padding:26px 30px;pointer-events:none}
.hud-top a,.hud-top button{pointer-events:auto}
.who{grid-area:who}
.who .nm{font:700 20px/1.15 var(--sans);letter-spacing:-.015em;margin:0}
.who .role{font:400 14px/1.3 var(--sans);color:var(--muted);margin-top:3px}
.clockbox{grid-area:clock;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.clock-label{font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:7px}
.live{width:7px;height:7px;border-radius:50%;background:var(--hit);box-shadow:0 0 0 3px rgba(58,208,107,.18)}
@media (prefers-reduced-motion:no-preference){.live{animation:blink 1.2s steps(2,start) infinite}}
@keyframes blink{50%{opacity:.25}}
.clock{font:300 clamp(28px,5vw,64px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.045em;white-space:nowrap;margin:0}
.clock .u{font-size:.4em;color:var(--muted);margin:0 .32em 0 .08em;letter-spacing:0;font-weight:500}
.clock .cs{color:var(--accent-ink)}

.title{position:absolute;left:0;right:0;top:27%;z-index:2;text-align:center;padding:0 16px;pointer-events:none;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.title h1{font:700 clamp(38px,7vw,124px)/.92 var(--sans);letter-spacing:-.05em;margin:0;text-wrap:balance}
.title h1 em{font-style:normal;color:var(--accent-ink);display:block}

</style>
</head>
<body>

<header class="stage" id="stage" tabindex="-1">

  <div class="hud-top">
    <div class="who">
      <p class="nm">aaghash murugesan</p>
      <div class="role">python dev</div>
    </div>
    <div class="clockbox">
      <div class="clock-label"><span class="live" aria-hidden="true"></span>since 19 sep 2022</div>
      <p class="clock" id="clock" aria-hidden="true"><span id="cy">0</span><span class="u">y</span><span id="cd">0</span><span class="u">d</span><span id="ct">00:00:00</span><span class="cs" id="cc">.00</span></p>
    </div>
  </div>

  <div class="title" id="title">
    <h1>aaghash murugesan. <em>still running.</em></h1>
  </div>

</header>

<script>
(() => {
'use strict';
const D = document, root = D.documentElement;
const $ = (s) => D.querySelector(s);

/* ---------- utils ---------- */
const pad = (n, l = 2) => String(n).padStart(l, '0');

/* ---------- dom refs ---------- */
const el = { cy: $('#cy'), cd: $('#cd'), ct: $('#ct'), cc: $('#cc') };

/* ---------- loop ---------- */
function frame() {
  requestAnimationFrame(frame);
  updateClock();
}

/* ---------- clock + hud ---------- */
function clockMs() {
  return Date.now();
}
const cache = {};
const setT = (node, k, v) => { if (cache[k] !== v) { cache[k] = v; node.textContent = v; } };
function updateClock() {
  const ms = clockMs(), now = new Date(ms);
  let y = now.getFullYear() - 2022, an = new Date(now.getFullYear(), 8, 19);
  if (now < an) { y--; an = new Date(now.getFullYear() - 1, 8, 19); }
  const d = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(an.getFullYear(), 8, 19)) / 864e5);
  const t = ms - new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  setT(el.cy, 'y', String(y)); setT(el.cd, 'd', String(d));
  setT(el.ct, 't', pad(Math.floor(t / 3.6e6)) + ':' + pad(Math.floor(t / 6e4) % 60) + ':' + pad(Math.floor(t / 1e3) % 60));
  setT(el.cc, 'c', '.' + pad(Math.floor(t / 10) % 100));
}

/* ---------- boot ---------- */
updateClock();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
